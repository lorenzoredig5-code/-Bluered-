<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autenticação Firebase</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f4f4f9;
    }
    .container {
      background: #fff;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      width: 320px;
      text-align: center;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      margin-top: 10px;
    }
    button:hover {
      background-color: #0056b3;
    }
    .escondido {
      display: none;
    }
    .mensagem-alerta {
      color: #28a745;
      background-color: #e8f5e9;
      padding: 15px;
      border-radius: 4px;
      border: 1px solid #a5d6a7;
    }
    .link-troca {
      margin-top: 15px;
      font-size: 14px;
      color: #007bff;
      cursor: pointer;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- TELA 1: CADASTRO -->
    <div id="tela-cadastro">
      <h2>Criar Conta</h2>
      <form id="form-cadastro">
        <input type="email" id="email-cadastro" placeholder="Digite seu e-mail" required />
        <input type="password" id="senha-cadastro" placeholder="Digite sua senha" required />
        <button type="submit">Cadastrar</button>
      </form>
      <div class="link-troca" id="go-to-login">Já tem uma conta? Faça Login</div>
    </div>

    <!-- TELA DE AVISO DE VERIFICAÇÃO -->
    <div id="tela-verificacao" class="escondido">
      <div class="mensagem-alerta">
        <strong>Espero por favor verifique se o e-mail!</strong>
        <p>Enviamos um link de confirmação para a sua caixa de entrada. Após clicar no link, faça o login novamente.</p>
      </div>
      <button id="btn-ir-login">Ir para o Login</button>
    </div>

    <!-- TELA 2: LOGIN -->
    <div id="tela-login" class="escondido">
      <h2>Acessar Conta</h2>
      <form id="form-login">
        <input type="email" id="email-login" placeholder="Digite seu e-mail de novo" required />
        <input type="password" id="senha-login" placeholder="Digite sua senha de novo" required />
        <button type="submit">Entrar no Site</button>
      </form>
      <div class="link-troca" id="go-to-cadastro">Não tem conta? Cadastre-se</div>
    </div>

  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      createUserWithEmailAndPassword, 
      sendEmailVerification, 
      signInWithEmailAndPassword, 
      signOut 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCDSZaI0FNuVTLGLru7M5Upm4l04B6LcXU",
      authDomain: "bluered-8832d.firebaseapp.com",
      databaseURL: "https://bluered-8832d-default-rtdb.firebaseio.com",
      projectId: "bluered-8832d",
      storageBucket: "bluered-8832d.firebasestorage.app",
      messagingSenderId: "622735655294",
      appId: "1:622735655294:web:ab950b5a71883f1eb4b32f"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Seletores de elementos da interface
    const telaCadastro = document.getElementById("tela-cadastro");
    const telaVerificacao = document.getElementById("tela-verificacao");
    const telaLogin = document.getElementById("tela-login");

    const formCadastro = document.getElementById("form-cadastro");
    const formLogin = document.getElementById("form-login");

    const goToLogin = document.getElementById("go-to-login");
    const goToCadastro = document.getElementById("go-to-cadastro");
    const btnIrLogin = document.getElementById("btn-ir-login");

    // Funções de navegação entre telas
    function exibirTela(telaExibir) {
      telaCadastro.classList.add("escondido");
      telaVerificacao.classList.add("escondido");
      telaLogin.classList.add("escondido");
      telaExibir.classList.remove("escondido");
    }

    goToLogin.addEventListener("click", () => exibirTela(telaLogin));
    goToCadastro.addEventListener("click", () => exibirTela(telaCadastro));
    btnIrLogin.addEventListener("click", () => exibirTela(telaLogin));

    // LÓGICA DE CADASTRO
    formCadastro.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email-cadastro").value;
      const senha = document.getElementById("senha-cadastro").value;

      try {
        // 1. Cria a conta
        const userCredential = await createUserWithEmailAndPassword(auth, email, senha);
        // 2. Envia e-mail de confirmação
        await sendEmailVerification(userCredential.user);
        // 3. Desconecta o usuário
        await signOut(auth);

        // Exibe a mensagem de aviso para verificar o e-mail
        exibirTela(telaVerificacao);
      } catch (error) {
        alert("Erro no cadastro: " + error.message);
      }
    });

    // LÓGICA DE LOGIN
    formLogin.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email-login").value;
      const senha = document.getElementById("senha-login").value;

      try {
        const userCredential = await signInWithEmailAndPassword(auth, email, senha);
        const user = userCredential.user;

        // Verifica se o usuário já clicou no link do e-mail
        if (user.emailVerified) {
          alert("Login confirmado com sucesso! Entrando no site...");
          // Redirecione para a página interna do seu site aqui:
          // window.location.href = "dashboard.html";
        } else {
          alert("Por favor, verifique seu e-mail antes de acessar. Enviamos o link para a sua caixa de entrada.");
          await signOut(auth);
        }
      } catch (error) {
        alert("Erro no login: " + error.message);
      }
    });
  </script>

</body>
</html>
